name: dator_erp
description: Sistema de Gestão - DatorERP
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.3
  retrofit: ^4.1.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.0.0
  go_router: ^13.2.1
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.0
  intl: 0.20.2
  mask_text_input_formatter: ^2.9.0
  mobile_scanner: ^5.2.3
  pdf: ^3.10.8
  printing: ^5.13.1
  share_plus: ^10.0.0
  path_provider: ^2.1.5
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1  # ← MOVIDO PARA dev_dependencies

flutter:
  uses-material-design: true
  assets:
    - assets/icons/  # Pasta onde a logo está

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/logo.png"
  web:
    generate: true
    image_path: "assets/icons/logo.png"
    background_color: "#1E88E5"
    theme_color: "#1E88E5"